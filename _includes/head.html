<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  <script>
  (function () {
    var ns = 'zalf-eng.github.io';
    var keys = ['total'{% if page.layout == 'post' %}, 'p-{{ page.slug | slice: 0, 60 }}'{% endif %}];
    keys.forEach(function (k) {
      try { fetch('https://abacus.jasoncameron.dev/hit/' + ns + '/' + k).catch(function () {}); } catch (e) {}
    });
  })();
  </script>
</head>
