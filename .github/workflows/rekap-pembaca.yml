name: Rekap pembaca harian
on:
  schedule:
    - cron: "7 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rekap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rekap_pembaca.py
      - name: Simpan hasil
        run: |
          git config user.name "rekap-pembaca"
          git config user.email "actions@users.noreply.github.com"
          git add stats/pembaca.json
          git diff --cached --quiet || git commit -m "Rekap pembaca"
          git pull --rebase
          git push
